; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino

; On macOS with the LILYGO T-Display S3, only the following debug tool works.
debug_tool = esp-builtin
debug_init_break = tbreak setup

; Upload configuration for the LILYGO T-Display S3
upload_protocol = esptool
upload_speed = 921600

; Monitor configuration for the LILYGO T-Display S3
monitor_speed = 115200

; Board detail configuration for the LILYGO T-Display S3
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Build type configuration for debug, but not enabled by default because it may be overridden by VSCode and PIOArduino automatically
;build_type = debug

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; General build configuration for debug, but not enabled by default because it may be overridden by VSCode and PIOArduino automatically
;debug_flags =
;    -O3
;    -g3
    
; Library dependencies
lib_deps =
    moononournation/GFX Library for Arduino